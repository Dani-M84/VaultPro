name: Build VaultPro APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:stable
    steps:
      - uses: actions/checkout@v4
      - name: Build APK for A36
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultPro-A36-APK
          path: bin/*.apk
