name: Build VaultPro APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: sudo apt update && sudo apt install -y zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: a36-fix-${{ hashFiles('buildozer.spec') }}
          restore-keys: a36-fix-
      - run: pip install --upgrade pip && pip install buildozer==1.5.0 cython==0.29.36 && pip install python-for-android
      - run: yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: VaultPro-A36-APK
          path: bin/*.apk
